<title id="figure-title">F07. H1-H5b verdicts for the internal WQP holdout; weighting defined by each estimand; horizons of 1, 2, and 3 months; registered denominators and Holm universes without substitution; authority ea8ddce7f8edb9a61db97e29178e52603fa371b1; limitation: for H1, direct ANFIS evidence is separated from auxiliary B1/B2 context, descriptive support is not elevated to confirmation, and not_estimable remains explicit.</title>
<desc id="figure-description">Sources: reports/closure_v1/00_protocol/hypothesis_registry.csv;reports/closure_v1/05_inference/multiplicity_report.csv;reports/closure_v1/06_degradation/failure_registry.csv;reports/closure_v1/07_anfis_ablation_evaluation/ablation_pairwise.csv;reports/closure_v1/08_uncertainty/uncertainty_ledger.csv;reports/closure_v1/09_planning/planning_bootstrap.csv. Filters: FINAL_CLOSURE_MATRIX rows grouped by hypothesis_id prefix; each hypothesis must have one consistent verdict; state vocabulary is non-binary and Holm cells use exact model/metric/population/estimand keys; H1 partitions 15 direct-ANFIS rows from 13 auxiliary B1/B2 context rows</desc>
<style>.heading{font:700 25px sans-serif;fill:#111827}.subtitle{font:14px sans-serif;fill:#374151}.label{font:13px sans-serif;fill:#111827}.small{font:11px sans-serif;fill:#374151}.value{font:11px monospace;fill:#111827}.axis{stroke:#4b5563;stroke-width:1;fill:none}.grid{stroke:#d1d5db;stroke-width:1;fill:none}.panel{fill:#f9fafb;stroke:#d1d5db;stroke-width:1}.na{fill:#e5e7eb;stroke:#6b7280;stroke-width:1}</style>
