schema_version: 1
description: >
  Declarative list of heavy artifacts that must be tracked with DVC and stored
  outside Git. The real GCS bucket is intentionally not recorded here.

dvc_policy:
  remote_url_example: gs://YOUR_PRIVATE_BUCKET/dvc
  real_bucket_policy: never_commit_real_bucket_names_or_credentials
  add_order:
    - raw_sources
    - canonical_observations
    - panels_targets_and_splits
    - diagnostics_and_operational_outputs
    - models
  integrity_rule: >
    DVC pointers must be committed together with updated SHA-256 manifests in
    data/freeze/ or data/catalog/ whenever source files or derived artifacts
    change.

artifacts:
  - artifact_id: raw_lakebed_us_cse
    path: data/raw/LakeBeD-US-CSE
    type: raw_source
    source_id: lakebed_us_cse
    dvc: true
    github_policy: pointer_only

  - artifact_id: raw_wqp
    path: data/raw/wqp
    type: raw_source
    source_id: wqp
    dvc: true
    github_policy: pointer_only

  - artifact_id: raw_aquamatch_chla
    path: data/raw/aquamatch
    type: raw_source
    source_id: aquamatch_chla
    dvc: true
    github_policy: pointer_only

  - artifact_id: raw_nla
    path: data/raw/nla
    type: raw_source
    source_id: nla
    dvc: true
    github_policy: pointer_only

  - artifact_id: observations_lakebed_us_cse
    path: data/interim/observations/lakebed_us_cse
    type: canonical_observations
    source_id: lakebed_us_cse
    dvc: true
    github_policy: pointer_only

  - artifact_id: observations_wqp
