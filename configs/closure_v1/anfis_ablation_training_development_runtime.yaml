model:
  family: direct_multitask_probabilistic_gru
  architecture_reference: src/experiments/train_pipe_grud.py
  common_architecture:
    hidden_dimension: 96
    recurrent_layers: 1
    dropout: 0.0
    add_last: false
    residual_mode: training_only_horizon_priors
    bloom_head: three_residual_logits_over_training_prevalence
    risk_head: three_residual_logits_over_training_mean_risk
