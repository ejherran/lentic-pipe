calibration_protocol:
  bloom_method_candidates: [identity, platt_logistic, isotonic_regression]
  bloom_score_source_by_model: {B0: predicted_bloom_probability, B1: predicted_bloom_probability, B2: predicted_bloom_probability, M0: raw_score, A0: predicted_bloom_probability, A1: predicted_bloom_probability}
  bloom_score_value_policy: finite_closed_unit_interval_reject_nan_no_normalization
  fixed_identity_model_ids: [B0]
  fixed_identity_calibrator_fit_policy: no_fit_fixed_transform
  fixed_identity_calibrator_fit_rows: 0
  fixed_identity_calibrator_refit_year: null
  fixed_identity_metrics_period: calibration_threshold
  fixed_identity_alert_threshold_period: calibration_threshold
  bloom_method_selection_metric: brier
  bloom_method_tie_tolerance: 0.001
  bloom_method_secondary_metric: expected_calibration_error
  bloom_method_secondary_metric_bins: 10
  bloom_method_secondary_metric_binning: equal_width
  bloom_method_simplicity_order: [identity, platt_logistic, isotonic_regression]
  bloom_method_selection_rule: within_0_001_of_minimum_brier_then_lowest_ECE_then_simplicity_order
  selected_method_refit_role: calibration_threshold
  alert_threshold_objective: maximize_f2
  alert_threshold_beta: 2.0
  alert_threshold_candidate_rule: unique_finite_calibrated_probabilities_plus_0_0_5_1
  alert_threshold_tie_break_order: [higher_recall, higher_precision, lower_threshold]
  ordinal_cutpoint_objective: maximize_macro_f1
  ordinal_cutpoint_tie_break_order: [lower_ordinal_mae, lexicographically_smaller_cutpoints]
  evaluation_refit: forbidden
  conformal_method: symmetric_scaled_sigma_split_conformal
  conformal_scale_floor: 0.000001  # 1e-6, fixed before calibration
  conformal_minimum_finite_rows_per_group: 30
  conformal_insufficient_group_policy: report_not_available_without_fallback_pooling
  conformal_quantile_interpolation: higher_order_statistic_no_interpolation

