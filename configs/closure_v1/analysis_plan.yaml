schema_version: closure_analysis_plan_v1_1
experiment_id: closure_v1
plan_version: "1.1"

experimental_matrix:
  config: configs/closure_v1/experimental_matrix.yaml
  status: ready_to_lock
  role: authoritative_closure_matrix_for_E6_E7_E8_E9
  legacy_planning_catalog: configs/counterfactual_planning_v1.yaml
  legacy_planning_catalog_role: scenario_catalog_provenance_only
  closure_roles_and_estimands_take_precedence: true
  deterministic_e6_mask_algorithm_locked: true
  e8_before_after_recalibration_contract_locked: true
  complete_e9_objective_locked_in_closure_matrix: true

protocol:
  gate: E0-P
  status: ready_to_lock
  registration_class: internal_git_locked_pseudoprospective
  alignment_base_commit: dba134a3f3759cf20651e2b8a08c658c3641d793
  namespace: closure_v1
  human_plan: docs/closure_v1/ANALYSIS_PLAN.md
  amendment: docs/closure_v1/PROTOCOL_AMENDMENT_V1_1.md
  machine_schema: configs/closure_v1/analysis_plan.schema.json
  claim_scope: held_out_wqp_monitoring_locations_within_frozen_cohort
  claim_authorizations:
    internal_locked_evaluation: true
    pseudoprospective_evaluation: true
    external_validation: false
    prospective_field_validation: false
    unseen_waterbody_transfer: false
    unrestricted_geographic_generalization: false
    ecological_causality: false
    official_environmental_recommendation: false

provenance:
  alignment_base_commit: dba134a3f3759cf20651e2b8a08c658c3641d793
  freeze_id: data_freeze_v0
  source_scope:
    - wqp
  same_source_as_development: true
  post_2021_outcomes_exist_in_repository: true
  legacy_temporal_test_previously_observed: true
  legacy_test_role: descriptive_continuity_only
  historical_freeze_git_state: dirty_at_generation
  historical_freeze_is_rewritten: false
  accepted_waterbody_crosswalk_exists: false
  dvc_alignment:
    declared_artifacts: 64
    explicit_pointers: 64
    remote_verification: successful_push_then_idempotent_push
    cloud_status_observation: command_hung_without_output_on_2026_08_02
  limitations:
    - Internal use of the WQP source and the existing freeze does not provide external validation.
    - Existing post-2021 outcomes make the design pseudoprospective rather than field-prospective.
    - Source-scoped WQP site identifiers are monitoring locations, not audited waterbody identities.
    - The historical freeze records a dirty Git state at generation.

time_roles:
  calendar_granularity: month
  boundary_policy: origin_and_target_must_remain_within_the_same_role
  crossing_rows: excluded_from_role
  training:
    start_rule: beginning_of_available_frozen_record
    end: "2018-12"
    target_end: "2018-12"
    both_origin_and_target_within_role: true
    permitted_uses:
      - fit_preprocessors
      - fit_fuzzy_memberships
      - fit_anfis_parameters
      - fit_model_parameters
      - fit_horizon_prevalence_baseline
  model_selection:
    start: "2019-01"
    end: "2020-12"
    origin_start: "2019-01"
    target_end: "2020-12"
    both_origin_and_target_within_role: true
    permitted_uses:
      - choose_bounded_hyperparameters
      - choose_baseline_family
      - choose_calibration_method
  calibration_threshold:
    start: "2021-01"
    end: "2021-12"
    origin_start: "2021-01"
    target_end: "2021-12"
    both_origin_and_target_within_role: true
    permitted_uses:
      - fit_selected_calibrator
      - select_alert_threshold
      - select_ordinal_cutpoints
  locked_evaluation:
    origin_start: "2022-01"
    target_start: "2022-01"
    end_rule: end_of_available_frozen_record
    both_origin_and_target_within_role: true
    permitted_uses:
      - one_sealed_evaluation_batch_after_E0_U
  holdout_locations_excluded_from_development_roles: true

holdout:
  holdout_id: closure_internal_unseen_wqp_locations_v1
  config: configs/closure_v1/location_holdout.yaml
  assignment_gate: E0-C
  unblinding_gate: E0-U
  information_cutoff: "2021-12"
  last_eligible_origin: "2021-09"
  source_ids:
    - wqp
  unit_type: wqp_monitoring_location
  group_key:
    - source_id
    - site_id
  identity_scope: source_native_monitoring_location
  selection_fraction: 0.20
  selection_seed: 20260802
  future_outcomes_used_for_assignment: false
  replacement_after_assignment: false
  missing_future_outcome_replacement: forbidden
  failed_model_replacement: forbidden
  waterbody_claim_authorized: false
  external_validation_claim_authorized: false
  grouped_e2b_role: predeclared_complementary_analysis

cohorts:
  assignment_is_immutable: true
  denominators:
    - assigned_units
    - intent_to_predict_origins
    - metric_evaluable_origins
    - shared_success_origins
  denominator_definitions:
    assigned_units:
      unit: wqp_monitoring_location
      definition: All monitoring locations assigned to the holdout before outcome access.
    intent_to_predict_origins:
      unit: origin
      definition: Origins determined from assignment and input history without using target availability or model success.
    metric_evaluable_origins:
      unit: origin
      definition: Intent-to-predict origins with the observed target required for the metric.
    shared_success_origins:
      unit: origin
      definition: Metric-evaluable origins with valid predictions from every model in the declared paired comparison.
  availability_denominator: intent_to_predict_origins
  failure_denominator: intent_to_predict_origins
  paired_quality_denominator: shared_success_origins
  individual_unpaired_quality_denominator: metric_evaluable_origins
  silent_row_deletion: forbidden
  silent_failure_exclusion_allowed: false

surfaces:
  primary_config: configs/closure_v1/surface_primary.yaml
  secondary_config: configs/closure_v1/surface_secondary.yaml
  primary:
    surface_id: closure_v1_wqp_adaptive_no_current_chla
    config: configs/closure_v1/surface_primary.yaml
    scientific_role: strict_early_warning
    observed_chla_at_any_input_lag: forbidden
  secondary:
    surface_id: closure_v1_wqp_adaptive_current_chla
    config: configs/closure_v1/surface_secondary.yaml
    scientific_role: monitoring_nowcasting_diagnostic
    eligible_for_primary_claim: false

models:
  config: configs/closure_v1/model_benchmark.yaml
  primary_candidate: P1
  required_primary_comparators:
    - B1
    - B2
    - P0
  strict_comparator_when_eligible: M0
  static_comparison:
    - F0
    - F1
  secondary_information_surface_variant: A2
  historical_pipe_grud_name_is_alias_only: true
  canonical_grud_claim_authorized: false

seeds:
  values:
    - 1729
    - 20260612
    - 20260613
    - 20260614
    - 314159
  stochastic:
    - 1729
    - 20260612
    - 20260613
    - 20260614
    - 314159
  deterministic_technical_seed: 1729
  pooling_as_independent_observations: forbidden
  pool_as_independent_replicates: false
  reporting_unit: per_fit_seed_then_across_seed_summary

calibration:
  method_selection_role: model_selection
  method_assessment:
    fit_period:
      start: "2019-01"
      end: "2019-12"
    score_period:
      start: "2020-01"
      end: "2020-12"
  bloom_method_candidates:
    - identity
    - platt_logistic
    - isotonic_regression
  bloom_method_selection_metric: brier
  bloom_method_tie_tolerance: 0.001
  bloom_method_secondary_metric: expected_calibration_error
  bloom_method_secondary_metric_bins: 10
  bloom_method_secondary_metric_binning: equal_width
  bloom_method_simplicity_order:
    - identity
    - platt_logistic
    - isotonic_regression
  bloom_method_selection_rule: within_0_001_of_minimum_brier_then_lowest_ECE_then_simplicity_order
  selected_method_fit_role: calibration_threshold
  alert_threshold:
    selection_role: calibration_threshold
    objective: maximize_f2
    beta: 2.0
    candidate_rule: unique_finite_calibrated_probabilities_plus_0_0_5_1
    tie_break_order:
      - higher_recall
      - higher_precision
      - lower_numeric_threshold
  ordinal_cutpoints:
    selection_role: calibration_threshold
    ordered: true
    objective: maximize_macro_f1
    tie_break_order:
      - lower_ordinal_mae
      - lexicographically_smaller_cutpoints
  primary_bloom_threshold_ugL: 30.0
  sensitivity_bloom_thresholds_ugL:
    - 25.0
    - 30.0
    - 33.0
    - 50.0
  evaluation_refit: forbidden

hypotheses:
  central_statement: The closure architecture is competitive for defined horizons and locations under the strict primary surface.
  primary:
    - id: H2_P1_vs_B1
      family: A
      comparison: P1_vs_B1
      question: Does the adaptive temporal model add signal beyond Chl-a-free persistence?
      endpoints:
        - pr_auc
        - brier
    - id: H2_P1_vs_B2
      family: A
      comparison: P1_vs_B2
      question: Does the adaptive temporal model add value beyond a strong raw-feature baseline?
      endpoints:
        - pr_auc
        - brier
    - id: H1_P1_vs_P0
      family: A
      comparison: P1_vs_P0
      question: Does adaptive ANFIS state improve the expert fuzzy temporal model?
      endpoints:
        - pr_auc
        - brier
    - id: H4_M0_vs_P1_control
      family: B
      comparison: M0_vs_P1_control
      question: Does strict MIFAL differ from PIPE under matched undegraded inputs?
      endpoints:
        - pr_auc
        - brier
    - id: H_surface_A2_vs_P1
      family: C
      comparison: A2_vs_P1
      question: How much predictive advantage is attributable to observed current chlorophyll-a?
      endpoints:
        - pr_auc
        - brier
  additional_predeclared_families:
    - id: B_matched_degradation
      matrix_reference: configs/closure_v1/experimental_matrix.yaml
      comparison_rule: M0_vs_P1_for_exactly_13_matrix_scenarios_3_horizons_2_endpoints
    - id: D_planning
      matrix_reference: configs/closure_v1/experimental_matrix.yaml
      comparison_rule: each_of_9_actions_vs_no_action_at_cost_1_support_1
    - id: E_uncertainty
      matrix_reference: configs/closure_v1/experimental_matrix.yaml
      comparison_rule: one_P1_primary_surface_aggregate_0_90_winkler_after_vs_before_test_0_80_0_95_descriptive
  competitiveness:
    pr_auc_absolute_noninferiority_margin: 0.02
    brier_absolute_noninferiority_margin: 0.01
    persistence_state_rmse_improvement_required: greater_than_zero
    persistence_state_mae_improvement_required: greater_than_zero
    margins_are_project_conventions_not_ecological_standards: true

multiplicity:
  method: holm
  family_wise_alpha: 0.05
  correction_scope: within_family_only
  correction_dimensions_are_family_specific: true
  family_dimension_rules:
    B:
      dimensions:
        - scenario
        - horizon
        - endpoint
      p_value_universe_size: 78
      matrix_reference: configs/closure_v1/experimental_matrix.yaml
    D:
      dimensions:
        - action_vs_no_action_at_primary_weights
      p_value_universe_size: 9
      matrix_reference: configs/closure_v1/experimental_matrix.yaml
    E:
      dimensions:
        - P1_primary_surface_yN_yF_yT_h1_h2_h3_90pct_aggregate_winkler_after_vs_before
      p_value_universe_size: 1
      matrix_reference: configs/closure_v1/experimental_matrix.yaml
  families:
    A:
      - P1_vs_B1
      - P1_vs_B2
      - P1_vs_P0
    B:
      - M0_vs_P1_control
      - M0_vs_P1_mcar_10
      - M0_vs_P1_mcar_25
      - M0_vs_P1_mcar_50
      - M0_vs_P1_block_1m_10
      - M0_vs_P1_block_3m_10
      - M0_vs_P1_block_6m_25
      - M0_vs_P1_ablate_nutrients
      - M0_vs_P1_ablate_physchem
      - M0_vs_P1_ablate_light
      - M0_vs_P1_ablate_temperature
      - M0_vs_P1_combined_moderate
      - M0_vs_P1_combined_severe
    C:
      - A2_vs_P1
    D:
      - tp_reduction_10_vs_no_action
      - tp_reduction_25_vs_no_action
      - tn_reduction_10_vs_no_action
      - tp_tn_reduction_10_vs_no_action
      - clarity_mild_vs_no_action
      - clarity_strong_vs_no_action
      - oxygen_support_05_vs_no_action
      - nutrient_clarity_mild_vs_no_action
      - nutrient_clarity_strong_vs_no_action
    E:
      - uncertainty_before_vs_after_recalibration
  descriptive_metrics_in_confirmatory_family: false

inference:
  primary_endpoints:
    bloom:
      - pr_auc
      - brier
    continuous_state:
      - rmse
      - mae
  secondary_bloom_endpoints:
    - recall
    - precision
    - f2
    - macro_f1
    - alert_rate
  trophic_endpoints:
    - macro_f1
    - quadratic_weighted_kappa
    - ordinal_mae
    - severe_error_rate
  estimands:
    - observation_weighted
    - location_balanced
  paired_cluster_unit: holdout_group_id
  bootstrap:
    method: paired_hierarchical_location_resampling
    final_replicates: 5000
    confidence_level: 0.95
    retain_all_paired_rows_within_sampled_location: true
  temporal_block_bootstrap:
    role: secondary
    block_length_months: 12
  complementary_tests:
    - wilcoxon_on_location_level_losses
    - mcnemar_on_paired_binary_decisions
  confidence_intervals_precede_p_values_in_interpretation: true
  confidence_interval_includes_zero_interpretation: difference_not_demonstrated_not_equivalence

failure_policy:
  terminal_statuses:
    - success
    - input_ineligible
    - target_unavailable
    - model_unavailable
    - numerical_failure
    - infrastructure_failure
  failure_codes:
    - NONE
    - INPUT_HISTORY_INCOMPLETE
    - INPUT_FORBIDDEN_CHLA_LINEAGE
    - TARGET_NOT_OBSERVED
    - MODEL_STRICT_ADAPTER_UNAVAILABLE
    - MODEL_CHECKPOINT_UNAVAILABLE
    - NONFINITE_PREDICTION
    - MODEL_EXECUTION_ERROR
    - INFRASTRUCTURE_ERROR
  input_eligibility_precedes_target_access: true
  failures_remain_in_availability_denominator: true
  failed_origin_replacement: forbidden
  failed_location_replacement: forbidden
  paired_metric_policy: exact_shared_success_intersection
  individual_metric_policy: label_as_unpaired_on_metric_evaluable_origins
  unresolved_mifal_strict_adapter_policy: report_M0_as_model_unavailable

outcome_access:
  current_gate: E0-P
  holdout_outcomes_accessed: false
  outcome_access_definition: semantic_decoding_inspection_aggregation_or_use_of_outcome_rows
  semantic_access_scope: rows_and_values_materialized_to_closure_application_logic
  storage_engine_internal_page_decoding_audited_or_claimed: false
  selector_requests_pre_cutoff_projection_at_parquet_read_api: true
  post_cutoff_target_rows_materialized_to_selector_logic: false
  byte_level_read_for_cryptographic_hashing_is_outcome_access: false
  locker_reads_complete_source_artifact_bytes_for_sha256: true
  locker_decodes_or_inspects_post_2021_outcome_rows: false
  evaluation_batches: 1
  explicit_authorization_required: true
  post_2021_holdout_outcome_status: sealed_not_opened_for_closure_v1
  pre_E0_U_access: forbidden
  pre_E0_U_allowed_holdout_fields:
    - source_id
    - site_id
    - origin_year_month
    - permitted_input_history_fields
    - assignment_role
  pre_E0_U_forbidden_operations:
    - read_post_cutoff_target_values
    - count_post_cutoff_target_availability
    - stratify_on_post_cutoff_outcomes
    - tune_on_post_cutoff_outcomes
    - emit_post_cutoff_holdout_metrics
  access_log: reports/closure_v1/00_protocol/outcome_access_log.jsonl
  access_log_required_state_at_E0_M: empty
  authorization_required: explicit_user_authorization_on_clean_locked_commit_or_tag
  opening_policy: one_sealed_batch
  training_runner_may_emit_evaluation_metrics: false

change_control:
  preserve_original_outputs: true
  post_metric_change_loses_locked_label: true
  ready_to_lock_material_change: update_all_affected_docs_configs_schema_and_tests
  after_lock_before_unblinding: create_new_protocol_version_and_lock_manifest
  technical_failure_before_metric_emission: documented_patch_version_and_complete_rerun
  change_after_metric_emission: preserve_original_outputs_and_label_new_analysis_exploratory
  original_batch_outputs_are_immutable: true
  holdout_reassignment_after_lock: forbidden
  post_unblinding_threshold_or_model_change: forbidden_for_locked_claim

locking:
  lock_gate: E0-P
  lock_status_after_success: locked
  require_clean_worktree: true
  require_schema_validation: true
  require_cross_file_contract_validation: true
  require_all_protocol_components: true
  hash_algorithm: sha256
  schema_path: configs/closure_v1/analysis_plan.schema.json
  commit_record_location: external_lock_manifest
  lock_manifest: reports/closure_v1/00_protocol/protocol_lock.json
  repository_state: reports/closure_v1/00_protocol/repository_state.json
  protocol_components:
    - docs/closure_v1/ANALYSIS_PLAN.md
    - docs/closure_v1/PROTOCOL_AMENDMENT_V1_1.md
    - configs/closure_v1/analysis_plan.yaml
    - configs/closure_v1/analysis_plan.schema.json
    - configs/closure_v1/surface_primary.yaml
    - configs/closure_v1/surface_secondary.yaml
    - configs/closure_v1/location_holdout.yaml
    - configs/closure_v1/model_benchmark.yaml
    - configs/closure_v1/experimental_matrix.yaml
    - configs/counterfactual_planning_v1.yaml
    - src/experiments/closure_contract.py
    - src/experiments/lock_closure_protocol.py
    - src/experiments/build_closure_holdout.py
  component_roles:
    configs/closure_v1/experimental_matrix.yaml: authoritative_closure_matrix
    configs/counterfactual_planning_v1.yaml: scenario_catalog_provenance_only
  source_artifacts:
    - path: data/freeze/data_freeze_manifest_v0.json
      role: frozen_data_provenance
    - path: data/freeze/DATA_FREEZE.md
      role: frozen_data_narrative
    - path: data/panel/panel_monthly_v0.parquet
      role: cutoff_safe_input_history_source
    - path: data/targets/monthly_targets_model_v0.parquet
      role: historical_stratification_and_later_evaluation_targets
    - path: data/targets/target_manifest_v0.json
      role: canonical_target_provenance_and_threshold_manifest
    - path: data/splits/monthly_model_splits_v0.parquet
      role: canonical_leakage_safe_temporal_rows
    - path: data/splits/split_manifest.json
      role: temporal_split_provenance
    - path: configs/site_resolution.yaml
      role: evidence_that_no_accepted_waterbody_crosswalk_exists
    - path: configs/variables.yaml
      role: canonical_variable_definitions
    - path: configs/dvc_artifacts.yaml
      role: aligned_heavy_artifact_inventory
  lock_command_creates_holdout_assignment: false
  lock_command_reads_complete_source_bytes_for_sha256: true
  lock_command_semantically_decodes_post_2021_outcomes: false
