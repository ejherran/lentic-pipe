schema_version: closure_development_runtime_v1
experiment_id: closure_v1
status: ready_to_lock
contract_role: derived_e0_d_implementation_contract

authority:
  protocol_lock_path: reports/closure_v1/00_protocol/protocol_lock.json
  protocol_lock_sha256: 7b6530dd3b918a61b55e26b54d5cd68919e9cf6919e3521b452f7b05e2ded9c6
  holdout_assignment_path: data/closure_v1/closure_holdout_assignment.csv
  holdout_assignment_sha256: b090994b9ec9a3cd6af8e3261879872a12efe301e02fe1727ded519b46ebedef
  holdout_manifest_path: reports/closure_v1/00_protocol/holdout_manifest.json
  holdout_manifest_sha256: b05e7767c35630806258494bcfac49ac26f7e628fea5d4185c5f9545ca480bc1
  common_origin_manifest_path: data/closure_v1/common_origin_manifest.parquet
  common_origin_completion_manifest_path: reports/closure_v1/01_surface/common_origin_manifest.json
  analysis_plan_path: configs/closure_v1/analysis_plan.yaml
  primary_surface_path: configs/closure_v1/surface_primary.yaml
  model_benchmark_path: configs/closure_v1/model_benchmark.yaml
  locked_protocol_amended: false
  lineage_interpretation:
    protocol_version: "1.1"
    change_class: implementation_clarification
    sealed_component_mutation: false
    scientific_endpoint_change: false
    rationale: no_current_state_targets_must_recycle_into_no_current_inputs
  runtime_contract_must_be_committed_before_fit: true
  runtime_lock_required_before_fit: true
  future_outcomes_accessed: false
  e0_u_authorized: false

development_scope:
  source_ids:
    - wqp
  assignment_role: development
  fit_role: training
  fit_target_end: "2018-12"
  model_selection_role: model_selection
  model_selection_start: "2019-01"
  model_selection_end: "2020-12"
  calibration_threshold_role: calibration_threshold
  calibration_threshold_start: "2021-01"
  calibration_threshold_end: "2021-12"
  locked_evaluation_start: "2022-01"
  post_2021_materialization_in_e0_d: forbidden
  holdout_fit_overlap_required: 0

seeds:
  pairing_policy: one_to_one_by_ordered_slot
  cross_product_policy: forbidden
  best_seed_selection: forbidden
  missing_slot_policy: retain_failure_and_exclude_shared_success_row
  ordered_slots:
    - slot: 1
      base_seed: 1729
      anfis_base_seed: 1729
      p0_model_seed: 1729
      p1_model_seed: 1729
    - slot: 2
