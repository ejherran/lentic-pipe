dvc_restoration:
  mode: remote_pull_in_isolated_clone_with_initially_empty_cache
  pointer_count: 8
  pull_command_template:
    - .venv/bin/dvc
    - pull
    - --no-run-cache
    - -j
    - "1"
    - "{pointer_path}"
  one_pointer_per_command: true
  tracked_config_contains_remote: false
