schema_version: closure_v2_analysis_plan_v1
experiment_id: closure_v2
plan_version: "1.0"
status: ready_to_lock

authorities:
  closure_v1_tag: thesis-closure-v1
  closure_v1_certification_commit: eb07598aa54a0944d1a87fe46d62415d0a4454aa
  closure_v1_science_commit: ea8ddce7f8edb9a61db97e29178e52603fa371b1
  closure_v1_synthesis_commit: 528dcb74a7c08b65f262901e4562a67b784db8c9
  closure_v1_editorial_commit: d1daa3059462854d6ddf5199fbc05515cec76982
  closure_v1_is_immutable: true
  v2_is_additive: true

surface:
  surface_id: closure_v2_wqp_adaptive_no_current_chla
  source_ids: [wqp]
  history_length_months: 12
  horizons_months: [1, 2, 3]
  observed_chla_at_any_input_lag: forbidden
  chla_derived_input_lineage: forbidden
  future_chla_target_only: true
  state_channels:
    - yN
    - yF
    - yT
    - sigma_N
    - sigma_F
    - sigma_T
    - delta_yN
    - delta_yF
    - delta_yT

time_roles:
  training: {target_end: "2018-12"}
  model_selection: {origin_start: "2019-01", target_end: "2020-12"}
  calibration_threshold: {origin_start: "2021-01", target_end: "2021-12"}
  origin_and_target_must_share_role: true
  holdout_locations_excluded_from_development: true

eligibility:
  policy: configs/closure_v2/eligibility_policy.yaml
  primary_strategy: complete_case_shared_fit
  incomplete_rows_retained_in_ledger: true
  incomplete_rows_contribute_to_loss: false
  family_authorization_uses_aggregate_thresholds: true

models:
  primary_candidate: P1
  expert_temporal_comparator: P0
  labels:
    P0: residual probabilistic GRU over expert fuzzy state without current Chl-a
    P1: residual probabilistic GRU over adaptive ANFIS state without current Chl-a
  architecture_and_budget_identical: true
  primary_fit_key_policy: exact_P0_P1_shared_fit_intersection
  canonical_grud_claim_authorized: false

seeds: [1729, 20260612, 20260613, 20260614, 314159]
seed_policy:
  replacement: forbidden
  ecological_replication_claim: forbidden
  completed: 5
  partially_available_minimum: 3
  model_family_unavailable_maximum: 2

training:
  device: cpu
  torch_num_threads: 1
  torch_num_interop_threads: 1
  architecture:
    input_dimension: 13
    target_dimension: 9
    hidden_dimension: 96
    recurrent_layers: 1
    dropout: 0.0
    residual_mode: add_last
    optimizer: AdamW
    learning_rate: 0.001
    weight_decay: 0.00001
    gradient_clip_norm: 1.0
    mse_weight: 1.0
  profiles:
    v2_primary: {batch_size: 512, maximum_epochs: 60, early_stopping_patience: 10, early_stopping_minimum_delta: 0.0}
    legacy_diagnostic: {batch_size: 2048, maximum_epochs: 20, early_stopping_patience: 5, early_stopping_minimum_delta: 0.0}
  profile_selection:
    data_role: model_selection
    primary_metric: probabilistic_validation_loss
    direction: lower_is_better
    tie_break: v2_primary
    evaluation_data_permitted: false

calibration:
  data_role: calibration_threshold
  candidate_calibrators: [identity, platt_logistic, isotonic_regression]
  primary_selection_metric: brier
  secondary_selection_metric: ece
  alert_threshold_metric: f2
  conformal_coverages: [0.80, 0.90, 0.95]
  recalibration_after_evaluation: forbidden

endpoints:
  primary: {id: bloom_h, threshold_ug_l: 30}
  secondary: [risk_chla, trophic_state_ordinal, future_state, interval_quality, operational_availability, planning_delta]
  sensitivity_thresholds_ug_l: [25, 30, 33, 50]

metrics:
  probability: [brier, pr_auc, ece, reliability]
  classification: [f2, recall, precision, macro_f1]
  continuous_state: [mae, rmse, nll]
  intervals: [picp, mpiw, winkler]
  availability: [success_rate, evaluable_rate, abstention_rate, failure_rate]
  trophic: [macro_f1, quadratic_kappa, ordinal_mae, severe_error]
  planning: [delta_objective_vs_no_action, support, cost, uncertainty]

denominators:
  - attempted
  - input_eligible
  - prediction_successful
  - target_available
  - metric_evaluable
  - shared_success

evaluation:
  cohort_config: configs/closure_v2/evaluation_cohorts.yaml
  layers: [legacy_posthoc, fresh_primary]
  primary_prediction: mean_probability_over_available_registered_seeds
  estimands: [observation_weighted, site_weighted]
  layer_pooling: forbidden
  estimand_pooling: forbidden
  refit: forbidden

inference:
  unit: source_id_plus_site_id
  paired_shared_success: true
  bootstrap_replicates: 2000
  confidence_level: 0.95
  pr_auc_minimum_valid_replicate_fraction: 0.95
  seed_pseudoreplication: forbidden
  unavailable_estimate_encoded_as_zero: false

multiplicity:
  method: holm
  reduce_family_for_unavailable_contrast: false
  families:
    A: [P1_vs_B2_brier_h1, P1_vs_B2_brier_h2, P1_vs_B2_brier_h3]
    B: [P1_vs_P0_brier_h1, P1_vs_P0_brier_h2, P1_vs_P0_brier_h3]
    C: [P1_vs_B2_pr_auc_h1, P1_vs_B2_pr_auc_h2, P1_vs_B2_pr_auc_h3, P1_vs_P0_pr_auc_h1, P1_vs_P0_pr_auc_h2, P1_vs_P0_pr_auc_h3]
    D: [all_registered_M0_vs_P1_degradation_contrasts]
    E: [tp_reduction_10, tp_reduction_25, tn_reduction_10, tp_tn_reduction_10, clarity_mild, clarity_strong, oxygen_support_05, nutrient_clarity_mild, nutrient_clarity_strong]

result_states:
  - confirmatory_available
  - descriptive_available
  - posthoc_available
  - insufficient_support
  - model_unavailable
  - not_applicable
  - failed

outcome_access:
  before_model_lock: forbidden
  availability_before_model_lock: forbidden
  activation_required: true
  activation_is_one_shot: true
  access_log: reports/closure_v2/00_protocol/outcome_access_log.jsonl
  replacement_after_access: forbidden

claim_boundaries:
  legacy_holdout_maximum: retrospective_complementary
  fresh_wqp_locations_maximum: internal_evaluation_on_unused_WQP_locations
  forward_temporal_maximum: post_lock_temporal_evaluation
  external_requires_comparable_target_contract: true
  field_causality: forbidden
  official_recommendations: forbidden

locking:
  protocol_lock: reports/closure_v2/00_protocol/protocol_lock.json
  artifact_inventory: reports/closure_v2/00_protocol/artifact_inventory.csv
  model_lock: reports/closure_v2/00_protocol/model_lock.json
  protocol_must_precede_fit: true
  model_lock_must_precede_outcomes: true
  manifest_written_last: true
