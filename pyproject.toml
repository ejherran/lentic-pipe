[project]
name = "lentic-pipe"
version = "0.1.0"
description = "Reproducible architecture for simulation, alerting, and counterfactual planning of algal proliferation in lentic water bodies."
readme = "README.md"
requires-python = ">=3.14,<3.15"
authors = [
  { name = "lentic-pipe contributors" },
]
dependencies = [
  "pyyaml>=6.0",
  "requests>=2.31",
  "huggingface-hub>=0.20",
  "pandas>=2.0",
  "numpy>=1.24",
  "pyarrow>=14.0",
  "openpyxl>=3.1",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
ty = "^0.0.37"
httpx = ">=0.27"

[tool.poetry.group.api]
optional = true

[tool.poetry.group.api.dependencies]
fastapi = ">=0.115"
uvicorn = ">=0.30"

[tool.poetry.group.modeling]
optional = true

[tool.poetry.group.modeling.dependencies]
scikit-learn = ">=1.3"
scikit-fuzzy = ">=0.4"
torch = ">=2.1"
torchdiffeq = ">=0.2.4"
miceforest = ">=5.7"
imbalanced-learn = ">=0.11"

[tool.poetry.group.sources]
optional = true

[tool.poetry.group.sources.dependencies]
earthaccess = ">=0.8"
beautifulsoup4 = ">=4.12"

[tool.poetry.group.data-versioning]
optional = true

[tool.poetry.group.data-versioning.dependencies]
dvc = {version = ">=3.0", extras = ["gs"]}

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
